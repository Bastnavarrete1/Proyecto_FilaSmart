<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - FilaSmart</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>FilaSmart</h1>
        <p>Crear una cuenta</p>
    </header>

    <main>

        <h2>Registrarse</h2>

        <form method="POST">

            <label for="nombre">Nombre:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

            <label for="correo">Correo electrónico:</label>
            <input
                type="email"
                id="correo"
                name="correo"
                required
            >

            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">
                Crear cuenta
            </button>

        </form>

        <p>
            ¿Ya tienes una cuenta?
            <a href="{{ url_for('inicio_sesion') }}">
                Iniciar sesión
            </a>
        </p>

        <a href="{{ url_for('inicio') }}">
            ← Volver al inicio
        </a>

    </main>

</body>
</html>
